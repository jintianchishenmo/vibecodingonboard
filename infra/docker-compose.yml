# Edge router. Traefik watches Docker and routes <app>.<LZ_APPS_DOMAIN> to each
# app container based on the labels the platform puts on it.
name: vibecodingonboard

services:
  traefik:
    # v3.6+ is required for Docker Engine 29 (older Traefik uses a Docker API version Engine 29 rejects).
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=lz-net
      - --entrypoints.web.address=:80
    ports:
      - "${LZ_PUBLIC_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lz-net
    restart: unless-stopped

networks:
  lz-net:
    name: lz-net
